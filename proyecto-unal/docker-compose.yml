version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: unal_postgres
    environment:
      POSTGRES_DB: unal_db
      POSTGRES_USER: unal_user
      POSTGRES_PASSWORD: unal_pass
    ports:
      - "5432:5432"
    volumes:
      - unal_pgdata:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unal_user -d unal_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: ./backend
      dockerfile: eureka-server/Dockerfile
      args:
        SERVICE_DIR: eureka-server
    container_name: unal_eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  gateway-service:
    build:
      context: ./backend
      dockerfile: gateway-service/Dockerfile
      args:
        SERVICE_DIR: gateway-service
    container_name: unal_gateway
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion-este-secreto-debe-ser-largo-y-seguro-de-al-menos-256-bits}
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
      args:
        SERVICE_DIR: auth-service
    container_name: unal_auth
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: unal_db
      DB_USER: unal_user
      DB_PASSWORD: unal_pass
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion-este-secreto-debe-ser-largo-y-seguro-de-al-menos-256-bits}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  matricula-service:
    build:
      context: ./backend
      dockerfile: matricula-service/Dockerfile
      args:
        SERVICE_DIR: matricula-service
    container_name: unal_matricula
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: unal_db
      DB_USER: unal_user
      DB_PASSWORD: unal_pass
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  modelos-service:
    build:
      context: ./backend
      dockerfile: modelos-service/Dockerfile
      args:
        SERVICE_DIR: modelos-service
    container_name: unal_modelos
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
      matricula-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unal_frontend
    ports:
      - "4200:80"
    depends_on:
      gateway-service:
        condition: service_healthy

volumes:
  unal_pgdata:
