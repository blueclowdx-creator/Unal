server:
  port: 8083

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/unal_db?currentSchema=unal_auth
    username: ${DB_USER:unal_user}
    password: ${DB_PASSWORD:unal_pass}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: unal_auth
        format_sql: false
    show-sql: false
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

unal:
  jwt:
    secret: ${JWT_SECRET:cambiar-en-produccion-este-secreto-debe-ser-largo-y-seguro-de-al-menos-256-bits}
    access-token-expiration-min: 30
    refresh-token-expiration-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    co.unal.proyecto.auth: INFO
    org.springframework.security: INFO
