server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders: "*"
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: matricula-service
          uri: lb://MATRICULA-SERVICE
          predicates:
            - Path=/api/matriculas/**
          filters:
            - JwtAuthFilter
        - id: modelos-service
          uri: lb://MODELOS-SERVICE
          predicates:
            - Path=/api/modelos/**
          filters:
            - JwtAuthFilter

unal:
  jwt:
    secret: ${JWT_SECRET:cambiar-en-produccion-este-secreto-debe-ser-largo-y-seguro-de-al-menos-256-bits}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
